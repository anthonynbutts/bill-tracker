<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bill Tracker">
  <meta name="theme-color" content="#000000">
  <title>Bill Tracker</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
            mono: ['"SF Mono"', '"JetBrains Mono"', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-black text-zinc-100 min-h-screen flex flex-col items-center justify-start sm:py-6 overflow-x-hidden selection:bg-emerald-500 selection:text-black">

  <!-- Desktop Toggle (iPhone 15 Frame / Full Width) -->
  <aside aria-label="Desktop View Switcher" class="hidden sm:flex items-center gap-2.5 mb-3 px-3.5 py-1.5 rounded-full bg-zinc-900/90 border border-zinc-800 text-[11px] text-zinc-400">
    <span class="text-zinc-200 font-medium">iPhone 15 View</span>
    <span class="text-zinc-600">•</span>
    <button id="toggleFrameBtn" class="hover:text-white transition-colors underline decoration-zinc-700 underline-offset-4">
      Full Width
    </button>
  </aside>

  <!-- iPhone 15 Shell -->
  <main id="deviceFrame" class="w-full sm:max-w-[412px] bg-black text-zinc-100 relative min-h-screen sm:min-h-[852px] sm:max-h-[900px] sm:rounded-[52px] sm:border-[9px] sm:border-zinc-800 sm:ring-1 sm:ring-zinc-700/60 sm:shadow-[0_25px_60px_rgba(0,0,0,0.9)] flex flex-col overflow-hidden">
    
    <!-- Dynamic Island (Mockup) -->
    <div id="dynamicIslandContainer" class="hidden sm:flex items-center justify-center pt-2.5 pb-1 select-none pointer-events-none sticky top-0 bg-black/80 backdrop-blur-md z-50">
      <div id="dynamicIsland" class="h-7 w-28 bg-black rounded-full flex items-center justify-between px-3 text-white border border-zinc-800 transition-transform">
        <span class="text-[10px] font-mono font-medium text-emerald-400" id="islandPaycheck">$215.00</span>
        <div class="w-2 h-2 rounded-full bg-blue-500/80"></div>
      </div>
    </div>

    <!-- Scrollable Content -->
    <div class="flex-1 overflow-y-auto px-4 pt-3 pb-10 smooth-scroll" id="scrollContent">
      
      <!-- Top Bar -->
      <header class="flex items-center justify-between py-1 mb-3">
        <div>
          <h1 class="text-base font-bold tracking-tight text-white">Bill Tracker</h1>
          <p class="text-[11px] text-zinc-500 font-mono" id="headerDate"></p>
        </div>

        <div class="flex items-center gap-1.5">
          <button id="copySummaryBtn" title="Copy Summary" class="tap-btn h-8 px-2.5 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center gap-1 text-xs text-zinc-300 hover:text-white">
            <svg class="w-3.5 h-3.5 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            <span>Copy</span>
          </button>
          
          <button id="resetWeekBtn" title="Reset Actuals" class="tap-btn w-8 h-8 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 hover:text-red-400">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
      </header>

      <!-- HERO OVERVIEW CARD: GOAL VS ACTUAL -->
      <section class="glass-card rounded-3xl p-4 sm:p-5 mb-4 relative overflow-hidden">
        <div class="flex items-start justify-between mb-2">
          <div>
            <span class="text-[10px] font-bold uppercase tracking-widest text-zinc-400">Paycheck Needed</span>
            <div class="text-3xl sm:text-4xl font-extrabold font-mono tracking-tight text-white mt-0.5" id="paycheckNeededDisplay">
              $215.00
            </div>
          </div>
          <span id="paycheckBadge" class="text-[11px] font-mono font-medium px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-300 border border-zinc-700/60 mt-1">
            $53.75 planned
          </span>
        </div>

        <!-- Overall Bill Progress Bar -->
        <div class="w-full bg-zinc-800/80 rounded-full h-2 overflow-hidden my-3">
          <div id="billProgressBar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>

        <!-- Two Clear Comparison Stats -->
        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-zinc-800/80 text-xs">
          <!-- DoorDash Goal vs Actual -->
          <div class="bg-black/40 rounded-2xl p-2.5 border border-zinc-800/60">
            <div class="text-[10px] uppercase font-bold text-zinc-400 mb-0.5">DoorDash (Mon-Sat)</div>
            <div class="flex items-baseline gap-1 font-mono">
              <span class="text-base font-bold text-orange-400" id="dashActualDisplay">$0.00</span>
              <span class="text-zinc-600">/</span>
              <div class="flex items-center text-zinc-400">
                <span class="text-[10px] mr-0.5">$</span>
                <input type="number" id="dashGoalInput" inputmode="decimal" step="0.01" min="0" value="161.25"
                  class="w-14 bg-transparent text-xs font-semibold focus:outline-none focus:text-white border-b border-transparent focus:border-zinc-500">
              </div>
            </div>
          </div>

          <!-- Total Needed Goal -->
          <div class="bg-black/40 rounded-2xl p-2.5 border border-zinc-800/60">
            <div class="text-[10px] uppercase font-bold text-zinc-400 mb-0.5">Total Bill Needed</div>
            <div class="flex items-center text-zinc-200 font-mono text-base font-bold">
              <span class="text-xs text-zinc-500 mr-0.5">$</span>
              <input type="number" id="totalBillGoalInput" inputmode="decimal" step="0.01" min="0" value="215.00"
                class="w-16 bg-transparent text-base font-bold focus:outline-none focus:text-white border-b border-transparent focus:border-zinc-500">
            </div>
          </div>
        </div>
      </section>

      <!-- DAILY SECTION HEADER -->
      <div class="flex items-center justify-between mb-2.5 px-1">
        <span class="text-[11px] font-bold uppercase tracking-wider text-zinc-400">Daily Dashes</span>
        <button id="distributeEvenlyBtn" class="tap-btn text-[11px] font-mono text-emerald-400 hover:text-emerald-300 flex items-center gap-1">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12h16M12 4v16"/></svg>
          <span>Split Goal (~$26.88/day)</span>
        </button>
      </div>

      <!-- 6 DAILY CARDS CONTAINER (MONDAY - SATURDAY) -->
      <div class="flex flex-col gap-2.5 mb-6" id="daysList">
        <!-- Rendered dynamically by app.js -->
      </div>

      <div class="text-center text-[10px] text-zinc-600 font-mono pb-2">
        Auto-saved • School Bill Tracker
      </div>

    </div>

    <!-- iPhone 15 Home Indicator Bar (Mockup) -->
    <div class="hidden sm:block absolute bottom-1 left-1/2 -translate-x-1/2 w-28 h-1 bg-zinc-700/60 rounded-full pointer-events-none z-50"></div>

  </main>

  <!-- iOS Toast -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 transform -translate-y-16 opacity-0 pointer-events-none transition-all duration-300 bg-zinc-900/95 border border-zinc-700 text-white px-3.5 py-1.5 rounded-full text-xs font-medium shadow-xl">
    <span id="toastMessage">Saved</span>
  </div>

  <script src="app.js"></script>
</body>
</html>

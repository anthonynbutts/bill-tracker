<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bill Tracker">
  <meta name="theme-color" content="#000000">
  <title>Bill Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'sans-serif'],
            mono: ['"SF Mono"', '"JetBrains Mono"', 'monospace']
          },
          borderRadius: {
            'ios': '18px',
            'island': '36px'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-black text-zinc-100 min-h-screen font-sans antialiased selection:bg-white selection:text-black flex flex-col items-center justify-start sm:py-6 overflow-x-hidden">

  <!-- Desktop iPhone 15 Frame Switcher -->
  <aside aria-label="Desktop View Switcher" class="hidden sm:flex items-center gap-3 mb-3 px-3.5 py-1.5 rounded-full bg-zinc-900 border border-zinc-800 text-[11px] text-zinc-400">
    <span class="text-zinc-300 font-medium">iPhone 15</span>
    <span class="text-zinc-600">•</span>
    <button id="toggleFrameBtn" class="hover:text-white transition-colors underline decoration-zinc-700 underline-offset-4">
      Full Width
    </button>
  </aside>

  <!-- iPhone 15 Chassis -->
  <main id="deviceFrame" class="device-iphone15 w-full sm:max-w-[400px] bg-black text-zinc-100 relative min-h-screen sm:min-h-[844px] sm:max-h-[890px] sm:rounded-[50px] sm:border-[8px] sm:border-zinc-800 sm:ring-1 sm:ring-zinc-700 sm:shadow-2xl flex flex-col overflow-hidden">
    
    <!-- Dynamic Island (Mockup) -->
    <div id="dynamicIslandContainer" class="hidden sm:flex items-center justify-center pt-2.5 pb-1 select-none pointer-events-none sticky top-0 bg-black/80 backdrop-blur-md z-50">
      <div id="dynamicIsland" class="h-7 w-28 bg-black rounded-island flex items-center justify-between px-3 text-white border border-zinc-800 transition-transform">
        <span class="text-[10px] font-mono font-medium text-emerald-400" id="islandPaycheck">$215.00</span>
        <div class="w-2.5 h-2.5 rounded-full bg-zinc-900 border border-zinc-700 flex items-center justify-center">
          <div class="w-1 h-1 rounded-full bg-blue-500/80"></div>
        </div>
      </div>
    </div>

    <!-- Scrollable Content -->
    <div id="scrollContainer" class="flex-1 overflow-y-auto px-3.5 pt-2 pb-24 custom-ios-scroll">
      
      <!-- Minimal Header -->
      <header class="flex items-center justify-between py-2 mb-2.5">
        <div class="flex items-center gap-2">
          <span class="text-sm font-bold tracking-tight text-white">Bill Tracker</span>
          <span class="text-[10px] font-mono text-zinc-500" id="headerDatePill"></span>
        </div>

        <div class="flex items-center gap-1">
          <button id="distributeEvenlyBtn" title="Split Dash Goal Evenly" class="h-7 px-2 rounded-lg bg-zinc-900 border border-zinc-800 text-[10px] font-mono text-zinc-300 hover:text-white active:scale-95 transition-transform">
            Split ~$26.88
          </button>
          <button id="copySummaryBtn" title="Copy" class="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-300 hover:text-white active:scale-95 transition-transform">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          </button>
          <button id="resetWeekBtn" title="Reset Week" class="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 hover:text-red-400 active:scale-95 transition-transform">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button id="themeToggleBtn" title="Theme" class="w-7 h-7 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white active:scale-95 transition-transform">
            <svg id="sunIcon" class="w-3.5 h-3.5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg id="moonIcon" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
        </div>
      </header>

      <!-- Minimal Dashboard Card -->
      <section class="rounded-2xl bg-zinc-900 border border-zinc-800 p-3.5 mb-3">
        <!-- Main Paycheck Metric -->
        <div class="flex items-center justify-between mb-3">
          <div>
            <div class="text-[10px] uppercase font-semibold text-zinc-400 tracking-wider">Paycheck Needed</div>
            <div class="text-3xl font-extrabold font-mono text-white tracking-tight" id="paycheckNeededDisplay">$215.00</div>
          </div>
          <div class="text-right">
            <span id="paycheckBadge" class="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400 border border-zinc-700">
              $53.75 planned
            </span>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-zinc-800 rounded-full h-1.5 overflow-hidden mb-3">
          <div id="dashProgressBar" class="bg-emerald-400 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>

        <!-- Compact Secondary Metrics -->
        <div class="grid grid-cols-2 gap-2 pt-2.5 border-t border-zinc-800/80 text-xs font-mono">
          <!-- Dash -->
          <div class="flex items-center justify-between bg-zinc-950/60 rounded-xl px-2.5 py-1.5 border border-zinc-800/60">
            <span class="text-zinc-400 text-[11px]">Dash</span>
            <div class="flex items-center gap-1 font-bold">
              <span id="dashActualDisplay" class="text-orange-400">$0.00</span>
              <span class="text-zinc-600">/</span>
              <input type="number" id="dashGoalInput" inputmode="decimal" step="0.01" min="0" value="161.25"
                class="w-12 bg-transparent text-right text-zinc-300 text-[11px] focus:outline-none focus:text-white border-b border-transparent focus:border-zinc-500">
            </div>
          </div>

          <!-- Total Needed -->
          <div class="flex items-center justify-between bg-zinc-950/60 rounded-xl px-2.5 py-1.5 border border-zinc-800/60">
            <span class="text-zinc-400 text-[11px]">Needed</span>
            <div class="flex items-center gap-0.5 font-bold">
              <span class="text-zinc-500 text-[10px]">$</span>
              <input type="number" id="totalBillGoalInput" inputmode="decimal" step="0.01" min="0" value="215.00"
                class="w-12 bg-transparent text-right text-zinc-200 text-[11px] focus:outline-none focus:text-white border-b border-transparent focus:border-zinc-500">
            </div>
          </div>
        </div>
      </section>

      <!-- Daily List (Monday - Saturday) -->
      <div class="flex flex-col gap-2" id="daysContainer">
        <!-- Injected via app.js -->
      </div>

    </div>

    <!-- Pinned Minimal Bottom Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-black/90 backdrop-blur-xl border-t border-zinc-800/80 px-4 py-2 z-40 flex items-center justify-between pb-[max(0.6rem,env(safe-area-inset-bottom))]">
      <div class="flex items-baseline gap-2">
        <span class="text-[10px] uppercase font-semibold text-zinc-400">Paycheck:</span>
        <span class="text-lg font-bold font-mono text-white" id="bottomPaycheckDisplay">$215.00</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-[11px] font-mono text-orange-400" id="bottomDashDisplay">$0.00 / $161.25</span>
        <button id="scrollToTopBtn" class="w-6 h-6 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 active:scale-95" title="Top">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m18 15-6-6-6 6"/></svg>
        </button>
      </div>
    </div>

    <!-- iPhone Home Bar (Mockup) -->
    <div class="hidden sm:block absolute bottom-1 left-1/2 -translate-x-1/2 w-28 h-1 bg-zinc-700/60 rounded-full pointer-events-none z-50"></div>

  </main>

  <!-- iOS Toast -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 transform -translate-y-16 opacity-0 pointer-events-none transition-all duration-300 bg-zinc-900/95 border border-zinc-700 text-white px-3 py-1.5 rounded-full text-xs font-medium shadow-xl">
    <span id="toastMessage">Saved</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
